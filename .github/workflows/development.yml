name: Development build

on:
  workflow_dispatch:

jobs:
  build:
    name: Development build
    strategy:
      matrix:
        include:
          - platform: 2
            platform_name: ios

    runs-on: macos-26

    steps:
      - name: Remove work folders
        run: |
          echo "before"
          ls -lah ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          echo "after"
          ls -lah ./

      - name: Checkout repository
        uses: actions/checkout@main

      - name: Checkout repository submodules
        shell: bash
        run: |
          set -euo pipefail

          # Check whether a remote contains the exact commit pinned
          # by the parent repository.
          source_has_commit() {
            local url="$1"
            local sha="$2"
            local probe_dir

            probe_dir="$(mktemp -d)"

            if GIT_TERMINAL_PROMPT=0 git \
              -c http.https://github.com/.extraheader= \
              clone --quiet --bare "$url" "$probe_dir/repo" \
              >/dev/null 2>&1 \
              && git --git-dir="$probe_dir/repo" \
                cat-file -e "${sha}^{commit}" 2>/dev/null; then
              rm -rf "$probe_dir"
              return 0
            fi

            rm -rf "$probe_dir"
            return 1
          }

          # Try the original repository first. Use the fallback only
          # when it contains the exact commit required by this build.
          select_submodule_url() {
            local path="$1"
            local original="$2"
            local fallback="$3"
            local sha
            local selected
            local module_name

            sha="$(git ls-tree HEAD -- "$path" |
              awk '$1 == "160000" { print $3 }')"

            if [[ -z "$sha" ]]; then
              echo "::error::Could not find pinned commit for $path"
              return 1
            fi

            if source_has_commit "$original" "$sha"; then
              selected="$original"
              echo "::notice::Using original source for $path ($sha)"

            elif source_has_commit "$fallback" "$sha"; then
              selected="$fallback"
              echo "::warning::Original source unavailable or missing commit; using fallback for $path ($sha)"

            else
              echo "::error::Neither source contains pinned commit $sha for $path"
              return 1
            fi

            # Resolve the actual submodule name from .gitmodules instead
            # of assuming it is identical to the working-tree path.
            module_name="$(
              git config -f .gitmodules --get-regexp \
                '^submodule\..*\.path$' |
              awk -v path="$path" '
                $2 == path {
                  name = $1
                  sub(/^submodule\./, "", name)
                  sub(/\.path$/, "", name)
                  print name
                  exit
                }
              '
            )"

            if [[ -z "$module_name" ]]; then
              echo "::error::Could not find submodule name for $path"
              return 1
            fi

            # Change only local Git configuration, not .gitmodules.
            git config --local --replace-all \
              "submodule.${module_name}.url" "$selected"
          }

          select_submodule_url \
            "Natives/external/DBNumberedSlider" \
            "https://github.com/khanhduytran0/DBNumberedSlider.git" \
            "https://github.com/immago/DBNumberedSlider.git"

          select_submodule_url \
            "Natives/external/fishhook" \
            "https://github.com/khanhduytran0/fishhook.git" \
            "https://github.com/jevinskie/fishhook.git"

          # Initialize all dependencies at the exact pinned commits.
          # AFNetworking and MobileGlues retain their original URLs.
          git -c http.https://github.com/.extraheader= \
            submodule update --init --recursive

      # No explicit Xcode pin needed — macos-26's default is expected
      # to provide the Xcode version used by the upstream build.
      #
      # If you want to lock it down for reproducibility instead:
      # - name: Select Xcode
      #   run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Install dpkg
        run: |
          brew install dpkg fakeroot || true

      - name: Install GNU Make (gmake)
        run: brew install make

      - name: Install JDK 8
        run: |
          brew install --cask temurin@8
          java -version

      - name: Install ldid
        run: brew install ldid

      - name: Build for ${{ matrix.platform_name }}
        run: |
          export PATH=/usr/sbin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin
          sysctl -n hw.ncpu
          gmake -j"$(sysctl -n hw.ncpu)" dsym package PLATFORM=${{ matrix.platform }}

      - name: Upload regular ipa
        uses: actions/upload-artifact@main
        with:
          name: org.angelauramc.amethyst-${{ matrix.platform_name }}.ipa
          path: artifacts/org.angelauramc.amethyst-*-${{ matrix.platform_name }}.ipa
